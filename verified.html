<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>噗囉記 email 驗證</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<script>
const classifyVerifyLanding = (function classifyVerifyLanding(raw) {
  const value = raw ?? "";
  const hashAt = value.indexOf("#");
  const queryAt = value.indexOf("?");
  const query = queryAt >= 0 ? value.slice(queryAt + 1, hashAt >= 0 ? hashAt : undefined) : "";
  const hash = hashAt >= 0 ? value.slice(hashAt + 1) : "";
  const params = new URLSearchParams([query, hash].filter(Boolean).join("&"));
  const error = params.get("error");
  const errorCode = params.get("error_code");
  const description = params.get("error_description");
  params.get("type");
  if (error) {
    return errorCode === "otp_expired" || /expired|invalid/i.test(description ?? "") ? "expired" : "error";
  }
  return params.has("access_token") ? "success" : "unknown";
});
const verificationState = classifyVerifyLanding(location.search + location.hash);
history.replaceState(null, "", location.pathname);
document.documentElement.dataset.state = verificationState;
</script>
<style>

  body {

    line-height: 1.75;

    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: clamp(1.75rem, 1.2rem + 2.2vw, 2.5rem); margin: 0 0 .35rem; letter-spacing: -.01em; }
  h2 { font-size: 1.2rem; margin: 2.5rem 0 .5rem; color: var(--accent); }
  p { margin: 0 0 .7rem; }
  a { color: var(--accent); }
  .updated { color: var(--muted); font-size: .9rem; margin-bottom: 1.75rem; }
  .intro {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 1.25rem;
    margin-bottom: .5rem;
  }
  .intro p:last-child { margin-bottom: 0; }
  .nav { margin-bottom: 2rem; font-size: .95rem; }
  footer {
    margin-top: 3.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: .875rem;
  }
  ul { padding-left: 1.2rem; margin: 0 0 .7rem; }
  li { margin-bottom: .35rem; }
</style>
</head>
<body>
<main>
<section class="verify verify-success">
<h1>email 驗證完成，請回到噗囉記登入</h1><p><a href="pupu://">打開噗囉記</a></p></section>
<section class="verify verify-expired"><h1>這個連結已失效或已被使用過</h1><p>如果你已經完成驗證（有些信箱會自動預先開啟連結），直接回 app 登入即可；登入時若仍提示尚未驗證，請在 app 的驗證畫面按「重寄驗證信」。</p><p><a href="pupu://">打開噗囉記</a></p></section>
<section class="verify verify-error"><h1>目前無法完成驗證</h1><p>請回到 app 重寄驗證信；若仍有問題，請聯絡 <a href="mailto:jasonliu0419yt@gmail.com">jasonliu0419yt@gmail.com</a>。</p></section>
<section class="verify verify-unknown"><h1>請從驗證信開啟連結</h1><p>完成驗證後，這裡會告訴你回到噗囉記登入。</p></section>
<style>.verify { display: none; } html:not([data-state]), html[data-state="unknown"] .verify-unknown, html[data-state="success"] .verify-success, html[data-state="expired"] .verify-expired, html[data-state="error"] .verify-error { display: block; }</style>
<footer>© 噗囉記</footer>
